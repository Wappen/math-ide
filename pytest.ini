[pytest]
# Math IDE test configuration.
#
# The default invocation
#     .venv/bin/python -m pytest -q
# runs the full OFFLINE suite: ingestion + ontology + navigation + renderer +
# pipeline + the end-to-end acceptance loop, all deterministic and network-free.
# Two suites self-skip unless explicitly enabled (see tests/README.md):
#   * the browser test  (tests/test_ide_browser.py)  -> needs Playwright + chromium
#   * the live-LLM tests (tests/test_acceptance_llm.py) -> need RUN_LLM_TESTS=1
#                                                          and ANTHROPIC_API_KEY
testpaths = tests
addopts = --strict-markers
markers =
    llm: tests that call the live Anthropic API (skipped unless RUN_LLM_TESTS=1 and ANTHROPIC_API_KEY is set).
    browser: tests that drive a real browser via Playwright (skipped unless playwright + a chromium binary are installed).
